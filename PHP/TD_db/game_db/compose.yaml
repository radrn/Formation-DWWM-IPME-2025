services:
  mysql:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=thepw
    volumes:
      - ./mysql:/var/www/html

  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8080:80
    environment:
      PMA_ARBITRARY: 1

  php:
    image: php:8.4-apache
    ports:
      - 80:80
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: thepw
      DB_NAME: jeux_video
    volumes:
      - ./:/var/www/html